trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self
    clean: true
    displayName: 'Pull Latest Code'

  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'

  - script: npm ci && npx playwright install --with-deps
    displayName: 'Install Dependencies & Browsers'

  - script: npx playwright test --grep @regression # Or your regression command
    displayName: 'Run Regression Test Suite'
    env:
      CI: 'true'
